name: Release module
# Publishes a release automatically whenever module.json on main carries a version
# that has no v<version> tag yet. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [module.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version and check for an existing tag
        id: ver
        run: |
          VERSION=$(jq -r .version module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set manifest and download URLs
        if: steps.ver.outputs.skip == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/v$V/module.zip" \
             '.url=$url | .manifest=$manifest | .download=$download' module.json > module.tmp && mv module.tmp module.json
      - name: Build zip
        if: steps.ver.outputs.skip == 'false'
        run: zip -r module.zip module.json scripts templates styles lang assets README.md LICENSE
      - name: Create release
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            module.json
            module.zip
